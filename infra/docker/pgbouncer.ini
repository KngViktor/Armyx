; Transaction pooling: thousands of client connections share a few dozen
; server connections. The API never relies on session state.
[databases]
armyx    = host=postgres         port=5432 dbname=armyx
armyx_ro = host=postgres-replica port=5432 dbname=armyx

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 40
reserve_pool_size = 10
server_idle_timeout = 60
ignore_startup_parameters = extra_float_digits,statement_timeout,application_name
