# Run before each rollout (e.g. Argo CD PreSync hook / Helm pre-upgrade).
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations: { argocd.argoproj.io/hook: PreSync, argocd.argoproj.io/hook-delete-policy: BeforeHookCreation }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: ghcr.io/armyx/api:latest
          command: ["tsx", "scripts/migrate.ts"]
          envFrom: [{ secretRef: { name: armyx-secrets } }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
