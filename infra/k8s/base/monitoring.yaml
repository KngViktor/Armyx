# Prometheus Operator resources (kube-prometheus-stack). Logs: Promtail/Alloy
# ships container stdout (JSON, PII-redacted) to Loki; dashboards in Grafana.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: { name: armyx }
spec:
  selector: { matchExpressions: [{ key: app, operator: In, values: [api, workers, pgbouncer] }] }
  podMetricsEndpoints: [{ port: metrics, interval: 15s }]
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: armyx-alerts }
spec:
  groups:
    - name: armyx.api
      rules:
        - alert: ApiHighErrorRate
          expr: sum(rate(armyx_http_requests_total{status=~"5.."}[5m])) / sum(rate(armyx_http_requests_total[5m])) > 0.02
          for: 5m
          labels: { severity: critical }
          annotations: { summary: "API 5xx rate above 2%", runbook: "docs/RUNBOOK.md#api-errors" }
        - alert: ApiHighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(armyx_http_request_duration_seconds_bucket{route!="unmatched"}[5m]))) > 0.8
          for: 10m
          labels: { severity: warning }
          annotations: { summary: "API p95 latency above 800ms" }
        - alert: ApiLoadShedding
          expr: sum(rate(armyx_http_shed_total[5m])) > 5
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "API pods are shedding load — check autoscaling headroom and the waiting room threshold" }
    - name: armyx.queues
      rules:
        - alert: SubmissionBacklog
          expr: max(armyx_queue_depth{queue="submissions"}) > 20000
          for: 10m
          labels: { severity: critical }
          annotations: { summary: "Submission backlog > 20k for 10m (applicants see 'processing')" }
        - alert: JobFailures
          expr: sum by (queue) (rate(armyx_jobs_total{result="failed"}[10m])) > 1
          for: 10m
          labels: { severity: warning }
          annotations: { summary: "Background job failures on {{ $labels.queue }}" }
    - name: armyx.data
      rules:
        - alert: PostgresReplicationLag
          expr: max(cnpg_pg_replication_lag) > 30
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "Read replica lag above 30s" }
        - alert: PostgresBackupStale
          expr: time() - max(cnpg_collector_last_available_backup_timestamp) > 93600
          labels: { severity: critical }
          annotations: { summary: "No successful database backup in the last 26 hours" }
        - alert: PgBouncerClientsWaiting
          expr: max(pgbouncer_pools_client_waiting_connections) > 50
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "Clients waiting for database connections" }
