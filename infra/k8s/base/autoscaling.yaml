# Autoscaling with KEDA (falls back to CPU like a plain HPA):
#  - API scales on CPU AND on request rate per pod (Prometheus), so it scales
#    out *before* CPU saturates when recruitment opens.
#  - Workers scale on queue backlog exported by the workers themselves.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: api }
spec:
  scaleTargetRef: { name: api }
  minReplicaCount: 6
  maxReplicaCount: 80
  pollingInterval: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:   { stabilizationWindowSeconds: 0, policies: [{ type: Percent, value: 100, periodSeconds: 15 }, { type: Pods, value: 10, periodSeconds: 15 }], selectPolicy: Max }
        scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 20, periodSeconds: 60 }] }
  triggers:
    - type: cpu
      metricType: Utilization
      metadata: { value: "60" }
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        # Target ~80 rps per pod (measured capacity ~250 rps/pod; see docs/LOAD-TESTING.md).
        query: sum(rate(armyx_http_requests_total{namespace="armyx"}[1m]))
        threshold: "80"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: workers-submissions }
spec:
  scaleTargetRef: { name: workers-submissions }
  minReplicaCount: 2
  maxReplicaCount: 30
  pollingInterval: 10
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        query: max(armyx_queue_depth{queue="submissions"})
        threshold: "500"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: workers-notifications }
spec:
  scaleTargetRef: { name: workers-notifications }
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        query: max(armyx_queue_depth{queue="notifications"})
        threshold: "2000"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: workers-heavy }
spec:
  scaleTargetRef: { name: workers-heavy }
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        query: max(armyx_queue_depth{queue="pdf"})
        threshold: "300"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: web }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 3
  maxReplicas: 20
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
